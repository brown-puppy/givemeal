name: align recordings

# 녹음이나 스크립트가 바뀌면 Whisper로 문장별 시작 시간을 뽑아 timings.json 을 커밋한다.
on:
  push:
    branches: [main]
    paths:
      - "audio/**"
      - "data/users/*/scripts.json"
      - "scripts/align.py"
      - ".github/workflows/align.yml"
  workflow_dispatch:
    inputs:
      force:
        description: "전부 다시 정렬"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: align
  cancel-in-progress: false

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/align.yml
      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small.en-v1
      - run: which ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
      - run: pip install "faster-whisper==1.2.1"
      - name: Align
        run: python3 scripts/align.py ${{ inputs.force && '--force' || '' }}
      - name: Validate
        run: python3 scripts/validate.py
      - name: Commit timings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- data/users)" ]; then echo "변경 없음"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/users/*/timings.json
          git add -u data/users
          git commit -m "chore(align): 녹음 문장 타이밍 갱신"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 5
          done
          # 봇 커밋은 Pages 자동 빌드를 안 띄울 수 있어서 직접 요청
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
